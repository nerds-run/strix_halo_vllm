---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    strix_halo_mode: "toolbox"
    strix_halo_require_devices: false
    strix_halo_kernel_args_enabled: false
    model_prefetch_enabled: false
    ui_enabled: false
    vllm_enabled: false
  tasks:
    - name: "CI/test mode notice"
      ansible.builtin.debug:
        msg: >
          Running in CI/test mode. Hardware-dependent tasks are skipped.
          Full tests require AMD Strix Halo gfx1151 hardware on Fedora.

    - name: "Test host_prereqs role inclusion"
      block:
        - name: "Include host_prereqs"
          ansible.builtin.include_role:
            name: nerdsrun.strix_halo_vllm.host_prereqs
      rescue:
        - name: "host_prereqs expected CI failure"
          ansible.builtin.debug:
            msg: "host_prereqs failed as expected in CI (requires Strix Halo + Fedora)"

    - name: "Test kernel_tuning role inclusion"
      block:
        - name: "Include kernel_tuning"
          ansible.builtin.include_role:
            name: nerdsrun.strix_halo_vllm.kernel_tuning
      rescue:
        - name: "kernel_tuning expected CI failure"
          ansible.builtin.debug:
            msg: "kernel_tuning failed as expected in CI (requires Fedora kernel args)"

    - name: "Test gpu_tuning role inclusion"
      vars:
        gpu_tuning_enabled: false  # skip actual sysfs writes in CI
      block:
        - name: "Include gpu_tuning"
          ansible.builtin.include_role:
            name: nerdsrun.strix_halo_vllm.gpu_tuning
      rescue:
        - name: "gpu_tuning expected CI failure"
          ansible.builtin.debug:
            msg: "gpu_tuning failed as expected in CI (requires Strix Halo amdgpu)"

    - name: "Validate gpu_tuning defaults are loadable"
      block:
        - name: "Load gpu_tuning defaults"
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../../roles/gpu_tuning/defaults/main.yml"

        - name: "Assert gpu_tuning variables are defined and sane"
          ansible.builtin.assert:
            that:
              - gpu_tuning_enabled is defined
              - gpu_tuning_perf_level in ['auto', 'high', 'manual', 'low']
              - gpu_tuning_profile_mode | int >= -1
              - gpu_tuning_unit_name | length > 0
              - gpu_tuning_unit_name is match('.*\\.service$')
            fail_msg: "gpu_tuning defaults are malformed"

    - name: "Test llamacpp_service role inclusion"
      vars:
        strix_halo_mode: "llamacpp"
        llamacpp_enabled: false
      block:
        - name: "Include llamacpp_service"
          ansible.builtin.include_role:
            name: nerdsrun.strix_halo_vllm.llamacpp_service
      rescue:
        - name: "llamacpp_service expected CI failure"
          ansible.builtin.debug:
            msg: "llamacpp_service failed as expected in CI (requires Strix Halo + Vulkan)"

    - name: "Validate llamacpp_service defaults are loadable"
      block:
        - name: "Load llamacpp_service defaults"
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../../roles/llamacpp_service/defaults/main.yml"
          register: _llamacpp_defaults

        - name: "Assert model profiles are defined"
          ansible.builtin.assert:
            that:
              - llamacpp_model_profiles is defined
              - "'big' in llamacpp_model_profiles"
              - "'coder' in llamacpp_model_profiles"
              - "'fast' in llamacpp_model_profiles"
              - "'nemotron' in llamacpp_model_profiles"
              - "'super' in llamacpp_model_profiles"
              - "'minimax' in llamacpp_model_profiles"
              - "llamacpp_model_profiles.big.repo is defined"
              - "llamacpp_model_profiles.coder.jinja | bool"
              - "llamacpp_model_profiles.coder.repeat_penalty | float > 0"
              - "llamacpp_model_profile == 'big'"
            fail_msg: "llamacpp_service defaults are malformed"

        - name: "Assert super profile has required Nemotron-3-Super launch config"
          ansible.builtin.assert:
            that:
              - "llamacpp_model_profiles.super.repo == 'unsloth/NVIDIA-Nemotron-3-Super-120B-A12B-GGUF'"
              - "'UD-Q3_K_XL' in llamacpp_model_profiles.super.file"
              - "llamacpp_model_profiles.super.temp | float == 1.0"
              - "llamacpp_model_profiles.super.top_p | float == 0.95"
              - "llamacpp_model_profiles.super.top_k | int == 0"
              - "llamacpp_model_profiles.super.jinja | bool"
              - "llamacpp_model_profiles.super.cache_type_k in ['q4_0', 'q8_0']"
              - "llamacpp_model_profiles.super.cache_type_v in ['q4_0', 'q8_0']"
              - "'--reasoning-format auto' in llamacpp_model_profiles.super.extra_args"
            fail_msg: "super profile is missing Nemotron-3-Super required launch params"

        # These three are pinned to exact values, not ranges: each is a measured
        # tuning result that a well-meaning edit could silently undo.
        - name: "Assert super profile keeps its measured tuning values"
          ansible.builtin.assert:
            that:
              # Full native 1M window. Verified ~73GiB total on hardware; KV is
              # only 2.25GiB (8 of 89 layers), so 1M is ~free vs 512K.
              - "llamacpp_model_profiles.super.ctx_size | int == 1048576"
              # gfx1151 prefill peak: 311 t/s. 1024 → 169, 4096 → 282 (regresses).
              - "llamacpp_model_profiles.super.ubatch_size | int == 2048"
              # 8GB prefix-reuse pool — safe at ~63GB resident, unlike minimax.
              - "'--cache-ram 8192' in llamacpp_model_profiles.super.extra_args"
            fail_msg: >-
              super profile tuning values were changed — these are measured
              optima, not defaults. Re-benchmark before altering.

        - name: "Assert --special is never passed (breaks the tool-call parser)"
          ansible.builtin.assert:
            that:
              - "'--special' not in (item.value.extra_args | default([]))"
            fail_msg: >-
              {{ item.key }} passes --special, which leaks <|im_end|> into the
              assistant stream as literal text and breaks tool-call parsing
            quiet: true
          loop: "{{ llamacpp_model_profiles | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: "Assert minimax profile has required MiniMax-M2.7 launch config"
          ansible.builtin.assert:
            that:
              - "llamacpp_model_profiles.minimax.repo == 'unsloth/MiniMax-M2.7-GGUF'"
              - "'UD-IQ4_XS' in llamacpp_model_profiles.minimax.file"
              - "llamacpp_model_profiles.minimax.temp | float == 1.0"
              - "llamacpp_model_profiles.minimax.top_p | float == 0.95"
              - "llamacpp_model_profiles.minimax.top_k | int == 40"
              - "llamacpp_model_profiles.minimax.jinja | bool"
              - "llamacpp_model_profiles.minimax.cache_type_k in ['q4_0', 'q8_0']"
              - "llamacpp_model_profiles.minimax.cache_type_v in ['q4_0', 'q8_0']"
            fail_msg: "minimax profile is missing MiniMax-M2.7 required launch params"

        - name: "Assert profile fields are consistent"
          ansible.builtin.assert:
            that:
              - item.value.repo is defined
              - item.value.file is defined
              - item.value.include is defined
              - item.value.ctx_size | int > 0
              - item.value.temp | float >= 0
              - item.value.top_p | float >= 0
              - item.value.top_k | int >= 0
            fail_msg: "Profile '{{ item.key }}' is missing required fields"
          loop: "{{ llamacpp_model_profiles | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

    - name: "Validate openwebui_ui mode-aware URL resolution"
      block:
        - name: "Test llamacpp mode URL resolution"
          ansible.builtin.set_fact:
            _test_url: >-
              {{ ''
                 if ('' | length > 0)
                 else ('http://127.0.0.1:8080/v1')
                 if ('llamacpp' == 'llamacpp')
                 else ('http://127.0.0.1:8000/v1') }}

        - name: "Assert llamacpp URL resolves to port 8080"
          ansible.builtin.assert:
            that:
              - "'8080' in _test_url"
            fail_msg: "URL resolution for llamacpp mode failed: {{ _test_url }}"
