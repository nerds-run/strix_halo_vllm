---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    strix_halo_mode: "toolbox"
    strix_halo_require_devices: false
    strix_halo_kernel_args_enabled: false
    model_prefetch_enabled: false
    ui_enabled: false
    vllm_enabled: false
  tasks:
    - name: "CI/test mode notice"
      ansible.builtin.debug:
        msg: >
          Running in CI/test mode. Hardware-dependent tasks are skipped.
          Full tests require AMD Strix Halo gfx1151 hardware on Fedora.

    - name: "Test host_prereqs role inclusion"
      block:
        - name: "Include host_prereqs"
          ansible.builtin.include_role:
            name: nerdsrun.strix_halo_vllm.host_prereqs
      rescue:
        - name: "host_prereqs expected CI failure"
          ansible.builtin.debug:
            msg: "host_prereqs failed as expected in CI (requires Strix Halo + Fedora)"

    - name: "Test kernel_tuning role inclusion"
      block:
        - name: "Include kernel_tuning"
          ansible.builtin.include_role:
            name: nerdsrun.strix_halo_vllm.kernel_tuning
      rescue:
        - name: "kernel_tuning expected CI failure"
          ansible.builtin.debug:
            msg: "kernel_tuning failed as expected in CI (requires Fedora kernel args)"

    - name: "Test gpu_tuning role inclusion"
      vars:
        gpu_tuning_enabled: false  # skip actual sysfs writes in CI
      block:
        - name: "Include gpu_tuning"
          ansible.builtin.include_role:
            name: nerdsrun.strix_halo_vllm.gpu_tuning
      rescue:
        - name: "gpu_tuning expected CI failure"
          ansible.builtin.debug:
            msg: "gpu_tuning failed as expected in CI (requires Strix Halo amdgpu)"

    - name: "Validate gpu_tuning defaults are loadable"
      block:
        - name: "Load gpu_tuning defaults"
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../../roles/gpu_tuning/defaults/main.yml"

        - name: "Assert gpu_tuning variables are defined and sane"
          ansible.builtin.assert:
            that:
              - gpu_tuning_enabled is defined
              - gpu_tuning_perf_level in ['auto', 'high', 'manual', 'low']
              - gpu_tuning_profile_mode | int >= -1
              - gpu_tuning_unit_name | length > 0
              - gpu_tuning_unit_name is match('.*\\.service$')
            fail_msg: "gpu_tuning defaults are malformed"

    - name: "Test llamacpp_service role inclusion"
      vars:
        strix_halo_mode: "llamacpp"
        llamacpp_enabled: false
      block:
        - name: "Include llamacpp_service"
          ansible.builtin.include_role:
            name: nerdsrun.strix_halo_vllm.llamacpp_service
      rescue:
        - name: "llamacpp_service expected CI failure"
          ansible.builtin.debug:
            msg: "llamacpp_service failed as expected in CI (requires Strix Halo + Vulkan)"

    - name: "Validate llamacpp_service defaults are loadable"
      block:
        - name: "Load llamacpp_service defaults"
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../../roles/llamacpp_service/defaults/main.yml"
          register: _llamacpp_defaults

        - name: "Assert model profiles are defined"
          ansible.builtin.assert:
            that:
              - llamacpp_model_profiles is defined
              - "'big' in llamacpp_model_profiles"
              - "'coder' in llamacpp_model_profiles"
              - "'fast' in llamacpp_model_profiles"
              - "'nemotron' in llamacpp_model_profiles"
              - "'super' in llamacpp_model_profiles"
              - "'minimax' in llamacpp_model_profiles"
              - "'lightning' in llamacpp_model_profiles"
              - "'coder-next' in llamacpp_model_profiles"
              - "llamacpp_model_profiles.big.repo is defined"
              - "llamacpp_model_profiles.coder.jinja | bool"
              - "llamacpp_model_profiles.coder.repeat_penalty | float > 0"
              - "llamacpp_model_profile == 'big'"
            fail_msg: "llamacpp_service defaults are malformed"

        - name: "Assert super profile has required Nemotron-3-Super launch config"
          ansible.builtin.assert:
            that:
              - "llamacpp_model_profiles.super.repo == 'unsloth/NVIDIA-Nemotron-3-Super-120B-A12B-GGUF'"
              - "'UD-Q3_K_XL' in llamacpp_model_profiles.super.file"
              - "llamacpp_model_profiles.super.temp | float == 1.0"
              - "llamacpp_model_profiles.super.top_p | float == 0.95"
              - "llamacpp_model_profiles.super.top_k | int == 0"
              - "llamacpp_model_profiles.super.jinja | bool"
              - "llamacpp_model_profiles.super.cache_type_k in ['q4_0', 'q8_0']"
              - "llamacpp_model_profiles.super.cache_type_v in ['q4_0', 'q8_0']"
              - "'--reasoning-format auto' in llamacpp_model_profiles.super.extra_args"
            fail_msg: "super profile is missing Nemotron-3-Super required launch params"

        # These three are pinned to exact values, not ranges: each is a measured
        # tuning result that a well-meaning edit could silently undo.
        - name: "Assert super profile keeps its measured tuning values"
          ansible.builtin.assert:
            that:
              # Full native 1M window. Verified ~73GiB total on hardware; KV is
              # only 2.25GiB (8 of 89 layers), so 1M is ~free vs 512K.
              - "llamacpp_model_profiles.super.ctx_size | int == 1048576"
              # gfx1151 prefill peak: 311 t/s. 1024 → 169, 4096 → 282 (regresses).
              - "llamacpp_model_profiles.super.ubatch_size | int == 2048"
              # 8GB prefix-reuse pool — safe at ~63GB resident, unlike minimax.
              - "'--cache-ram 8192' in llamacpp_model_profiles.super.extra_args"
            fail_msg: >-
              super profile tuning values were changed — these are measured
              optima, not defaults. Re-benchmark before altering.

        - name: "Assert --special is never passed (breaks the tool-call parser)"
          ansible.builtin.assert:
            that:
              - "'--special' not in (item.value.extra_args | default([]))"
            fail_msg: >-
              {{ item.key }} passes --special, which leaks <|im_end|> into the
              assistant stream as literal text and breaks tool-call parsing
            quiet: true
          loop: "{{ llamacpp_model_profiles | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: "Assert minimax profile has required MiniMax-M2.7 launch config"
          ansible.builtin.assert:
            that:
              - "llamacpp_model_profiles.minimax.repo == 'unsloth/MiniMax-M2.7-GGUF'"
              - "'UD-IQ4_XS' in llamacpp_model_profiles.minimax.file"
              - "llamacpp_model_profiles.minimax.temp | float == 1.0"
              - "llamacpp_model_profiles.minimax.top_p | float == 0.95"
              - "llamacpp_model_profiles.minimax.top_k | int == 40"
              - "llamacpp_model_profiles.minimax.jinja | bool"
              - "llamacpp_model_profiles.minimax.cache_type_k in ['q4_0', 'q8_0']"
              - "llamacpp_model_profiles.minimax.cache_type_v in ['q4_0', 'q8_0']"
            fail_msg: "minimax profile is missing MiniMax-M2.7 required launch params"

        # The Vulkan-targeted `deepseek` profile was REMOVED, not re-gated.
        # It only ever existed to hold the model against an image that cannot
        # load `deepseek4`; `deepseek-v4` on ROCm supersedes it entirely, and
        # a permanently-gated profile is an invitation to ungate it. Its
        # weights (118 GB) were deleted, so reintroducing the name would mean
        # a re-download of a model that is already served better.
        - name: "Assert the Vulkan deepseek profile stays removed"
          ansible.builtin.assert:
            that:
              - "'deepseek' not in llamacpp_model_profiles"
              - "'deepseek-v4' in llamacpp_model_profiles"
            fail_msg: >-
              The bare `deepseek` profile is back. It targets the Vulkan image,
              where the deepseek4 arch has no implementation, and its 118 GB of
              weights were deleted. Use `deepseek-v4` (ROCm) instead.

        # deepseek was ungated on 2026-08-13 after it was verified to run.
        # The guard mechanism stays in the role for future use; no profile
        # currently sets unsupported_reason, and the override stays off.
        - name: "Assert no profile is gated, and the override defaults to off"
          ansible.builtin.assert:
            that:
              - >-
                (llamacpp_model_profiles | dict2items
                 | selectattr('value.unsupported_reason', 'defined')
                 | map(attribute='key') | list) == []
              - "not (llamacpp_allow_unsupported | bool)"
            fail_msg: >-
              Unexpected gated-profile set
              {{ llamacpp_model_profiles | dict2items | selectattr('value.unsupported_reason', 'defined') | map(attribute='key') | list }}
              or llamacpp_allow_unsupported defaults to true

        - name: "Assert profile fields are consistent"
          ansible.builtin.assert:
            that:
              - item.value.repo is defined
              - item.value.file is defined
              - item.value.include is defined
              - item.value.ctx_size | int > 0
              - item.value.temp | float >= 0
              - item.value.top_p | float >= 0
              - item.value.top_k | int >= 0
            fail_msg: "Profile '{{ item.key }}' is missing required fields"
          loop: "{{ llamacpp_model_profiles | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        # --- Documentation drift guard -----------------------------------
        # This repo's docs carry measured numbers, so a profile that exists in
        # code but not in the docs is a real defect, not a tidiness issue. This
        # session began with exactly that drift (three profiles shipped with no
        # mention in CLAUDE.md and stale TBDs in README).
        - name: "Read the docs that must enumerate every profile"
          ansible.builtin.slurp:
            src: "{{ item }}"
          register: _docs
          loop:
            - "{{ playbook_dir }}/../../../../../README.md"
            - "{{ playbook_dir }}/../../../../../mise.toml"
            - "{{ playbook_dir }}/../../docs/GETTING_STARTED.md"
            - "{{ playbook_dir }}/../../docs/VARIABLES.md"
          loop_control:
            label: "{{ item | basename }}"

        - name: "Assert every profile appears in README, mise.toml, GETTING_STARTED and VARIABLES"
          ansible.builtin.assert:
            that:
              - "item.0.key in (item.1.content | b64decode)"
            fail_msg: >-
              Profile '{{ item.0.key }}' is defined in defaults but absent from
              {{ item.1.item | basename }}. Every profile needs a deploy task
              and a documented tok/s figure — silent profiles are how the
              fleet's published numbers drifted out of date before.
          loop: "{{ llamacpp_model_profiles | dict2items | product(_docs.results) | list }}"
          loop_control:
            label: "{{ item.0.key }} in {{ item.1.item | basename }}"

        # --- Regression guards -------------------------------------------
        # Every assertion below encodes a failure that actually happened on
        # hardware and cost real debugging time. All of them failed SILENTLY:
        # the server started, answered requests, and only throughput or a
        # crash-on-a-specific-input revealed the problem. Do not relax one
        # without re-measuring the thing it protects.

        - name: "Assert the ROCm profiles declare the KFD device and --ipc=host"
          ansible.builtin.assert:
            that:
              - "'/dev/kfd' in (item.value.devices | default([]))"
              - "'--ipc=host' in (item.value.podman_args | default([]))"
            fail_msg: >-
              ROCm profile '{{ item.key }}' must add /dev/kfd and pass
              --ipc=host. Without --ipc=host the HSA runtime cannot map its
              shared-memory segments and model load dies with
              "Memory critical error ... Reason: Memory in use", which reads
              like an OOM and is not one.
          loop: "{{ llamacpp_model_profiles | dict2items | selectattr('value.backend', 'defined') | list }}"
          loop_control:
            label: "{{ item.key }}"

        - name: "Assert unified memory is set for qwen38-fp4 and NOT for deepseek-v4"
          ansible.builtin.assert:
            that:
              - "llamacpp_model_profiles['qwen38-fp4'].env.GGML_HIP_ENABLE_UNIFIED_MEMORY is defined"
              - "llamacpp_model_profiles['deepseek-v4'].env.GGML_HIP_ENABLE_UNIFIED_MEMORY is not defined"
            fail_msg: >-
              GGML_HIP_ENABLE_UNIFIED_MEMORY is per-profile, not global. It is
              correct for qwen38-fp4 (~14GB) and measured harmful for
              deepseek-v4 (~97GB): managed allocations never enter GTT
              (mem_info_gtt_used stayed at 0 of 124 GiB) and decode collapsed
              to ~3.4 tok/s with no error logged.

        - name: "Assert deepseek-v4 pins autofit off and a single slot"
          ansible.builtin.assert:
            that:
              - "'-fit off' in llamacpp_model_profiles['deepseek-v4'].extra_args"
              - "llamacpp_model_profiles['deepseek-v4'].parallel_slots | int == 1"
            fail_msg: >-
              deepseek-v4 needs -fit off and parallel_slots 1. Autofit reads
              MemAvailable, which is lowest right after unloading the previous
              model, and silently placed the whole 97GB on CPU (3.4 tok/s).
              n_parallel auto picked 4 slots and pinned 120 of 125 GB.

        - name: "Assert deepseek-v4 ships no speculative drafter"
          ansible.builtin.assert:
            that:
              - "llamacpp_model_profiles['deepseek-v4'].draft_file is not defined"
              - "llamacpp_model_profiles['deepseek-v4'].spec_type is not defined"
            fail_msg: >-
              deepseek-v4 must not enable DSpark. Measured a 2.5x LOSS (the
              10.15GB drafter exceeds the ~4.7GB the target reads per token),
              and on mainline it fails to load outright with
              "key not found in model: dflash.attention.sliding_window_pattern".

        - name: "Assert vision is on qwen38 and off qwen38-fp4"
          ansible.builtin.assert:
            that:
              - "llamacpp_model_profiles['qwen38'].mmproj_file is defined"
              - "llamacpp_model_profiles['qwen38-fp4'].mmproj_file is not defined"
            fail_msg: >-
              Vision belongs on qwen38 only. On qwen38-fp4 an image request
              aborts the server (server-context.cpp:3192, ggml_abort) because
              multimodal and MTP speculative decoding cannot be combined on
              this build. The projector alone is fine; the pairing is not.

        - name: "Assert --reasoning-preserve is never sent to the ROCmFPX fork"
          ansible.builtin.assert:
            that:
              - "'--reasoning-preserve' not in (llamacpp_model_profiles['qwen38-fp4'].extra_args | join(' '))"
              - "'--reasoning-preserve' not in (llamacpp_model_profiles['deepseek-v4'].extra_args | join(' '))"
            fail_msg: >-
              The ROCm images reject --reasoning-preserve outright
              ("invalid argument"), and llama-server exits 1 into a systemd
              restart loop. Flag sets differ per build; keep it on the Vulkan
              profile only.

        - name: "Assert list-valued include patterns exist where sidecars are needed"
          ansible.builtin.assert:
            that:
              - "item.value.include is string or (item.value.include | length) > 0"
              - >-
                (item.value.mmproj_file is not defined)
                or (item.value.include is not string)
            fail_msg: >-
              Profile '{{ item.key }}' declares a projector or drafter but a
              single-string include, so the sidecar would never download.
              Note hf takes ONE pattern per --include flag; passing several
              after one flag silently reparses them as positional filenames
              and drops --include entirely, exiting 0 with the wrong files.
          loop: "{{ llamacpp_model_profiles | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: "Assert extra_args never duplicates a templated flag"
          ansible.builtin.assert:
            that:
              - "'--parallel' not in (item.value.extra_args | default([]) | join(' '))"
              - "'-np ' not in (item.value.extra_args | default([]) | join(' ') ~ ' ')"
              - "'--ctx-size' not in (item.value.extra_args | default([]) | join(' '))"
              - "'--mmproj' not in (item.value.extra_args | default([]) | join(' '))"
              - "'--model-draft' not in (item.value.extra_args | default([]) | join(' '))"
              - "'--chat-template-kwargs' not in (item.value.extra_args | default([]) | join(' '))"
            fail_msg: >-
              Profile '{{ item.key }}' sets a flag in extra_args that the
              template already renders from a dedicated key. extra_args is
              emitted LAST, so llama.cpp takes it as the final occurrence and
              the dedicated key is silently ignored — the server then runs a
              different config than the profile declares, with no warning.
              This actually happened: --parallel 1 in extra_args overrode
              parallel_slots 4 and the server served 1 slot.
              Use parallel_slots / ctx_size / mmproj_file / draft_file /
              chat_template_kwargs instead.
          loop: "{{ llamacpp_model_profiles | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: "Assert every speculative profile is fully specified"
          ansible.builtin.assert:
            that:
              - "item.value.spec_type is defined"
              - "item.value.draft_ngl is defined"
              - "item.value.spec_n_max is defined"
            fail_msg: >-
              Profile '{{ item.key }}' sets draft_file but not the rest of the
              speculative config. Without draft_ngl the draft head can land on
              CPU and the entire speculative gain disappears; spec_n_max must
              be pinned because the llama.cpp default is far down the wrong
              side of the acceptance curve.
          loop: "{{ llamacpp_model_profiles | dict2items | selectattr('value.draft_file', 'defined') | list }}"
          loop_control:
            label: "{{ item.key }}"

    # Renders the real Quadlet template for every profile. This is the only
    # test that exercises the Jinja itself — where this project's documented
    # whitespace/continuation pitfalls actually live.
    - name: "Validate llamacpp Quadlet template renders correctly"
      block:
        # These tasks build throwaway fixtures, so they report changed_when:
        # false — otherwise molecule's idempotence stage fails on every run.
        - name: "Create render scratch dir"
          ansible.builtin.tempfile:
            state: directory
            suffix: quadlet-render
          register: _render_dir
          changed_when: false

        - name: "Render Quadlet for each profile"
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../roles/llamacpp_service/templates/llamacpp-server.container.j2"
            dest: "{{ _render_dir.path }}/{{ item.key }}.container"
            mode: "0600"
          changed_when: false
          vars:
            llamacpp_model_profile: "{{ item.key }}"
            llamacpp_active: "{{ item.value }}"
            llamacpp_service_model_dir_expanded: "/tmp/models"
            llamacpp_service_repo_dir: "{{ item.value.repo | regex_replace('/', '_') }}"
          loop: "{{ llamacpp_model_profiles | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: "Read rendered units"
          ansible.builtin.slurp:
            src: "{{ _render_dir.path }}/{{ item.key }}.container"
          register: _rendered
          loop: "{{ llamacpp_model_profiles | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: "Assert each rendered unit is structurally sound"
          ansible.builtin.assert:
            that:
              # The Exec line must exist and name the profile's own GGUF.
              - "'Exec=llama-server' in _text"
              - "item.item.value.file in _text"
              # ctx/batch/ubatch must reach the command line.
              - "('--ctx-size ' ~ item.item.value.ctx_size) in _text"
              - >-
                (item.item.value.ubatch_size is not defined)
                or (('-ub ' ~ item.item.value.ubatch_size) in _text)
              # repeat_penalty 0 must OMIT the flag, not pass a literal 0.
              - >-
                ('--repeat-penalty' in _text)
                == ((item.item.value.repeat_penalty | default(0) | float) > 0)
              # Never emit --special (breaks tool-call parsing).
              - "'--special' not in _text"
              # Per-profile image override must win over the global.
              - >-
                (item.item.value.image is not defined)
                or (('Image=' ~ item.item.value.image) in _text)
              # A profile's extra devices must all reach AddDevice lines.
              - >-
                (item.item.value.devices is not defined)
                or (item.item.value.devices
                    | reject('in', _text | regex_findall('AddDevice=(\\S+)'))
                    | list | length == 0)
              # podman_args must render as a PodmanArgs= line (ROCm needs
              # --ipc=host; without it the HSA runtime fails to map memory).
              - >-
                (item.item.value.podman_args is not defined)
                or (('PodmanArgs=' ~ (item.item.value.podman_args | join(' '))) in _text)
              # A drafter must resolve against draft_repo when it lives in a
              # different repo from the target, not against the target's dir.
              - >-
                (item.item.value.draft_file is not defined)
                or (('--model-draft /models/'
                     ~ ((item.item.value.draft_repo | default(item.item.value.repo)) | regex_replace('/', '_'))
                     ~ '/' ~ item.item.value.draft_file) in _text)
              # Speculation must never render half-configured.
              - >-
                ('--spec-type' in _text) == (item.item.value.draft_file is defined)
              # The vision projector is rendered only where declared.
              - >-
                ('--mmproj' in _text) == (item.item.value.mmproj_file is defined)
              # chat_template_kwargs must render as valid JSON on one flag.
              - >-
                (item.item.value.chat_template_kwargs is not defined)
                or (("--chat-template-kwargs '" ~ (item.item.value.chat_template_kwargs | to_json) ~ "'") in _text)
              # The command must terminate with the alias line, proving the
              # whole backslash-continued block survived rendering intact.
              # Compares against llamacpp_model_profile rather than item.key:
              # include_vars above outranks task vars, so the template always
              # sees the default profile name. Per-profile identity is already
              # covered by the `file` assertion.
              - "('--alias ' ~ llamacpp_model_profile) in _text"
              # Every Exec line except the terminator keeps its trailing
              # backslash. A dropped one silently truncates the command.
              - "_bad_cont | length == 0"
            fail_msg: >-
              Rendered Quadlet for profile '{{ item.item.key }}' is malformed.
              Exec lines missing a continuation backslash: {{ _bad_cont }}
            quiet: true
          vars:
            _text: "{{ item.content | b64decode }}"
            # Regex lives in its own scalar: nesting it as a Jinja string
            # literal collapses the escaping into an invalid character class.
            _bs_rx: >-
              [\\]$
            # Double-quoted so YAML turns \n into a real newline before Jinja
            # sees it — a folded scalar leaves it literal and the split no-ops.
            _exec_lines: "{{ (item.content | b64decode).split('Exec=')[1].split('\n[Service]')[0].split('\n') }}"
            # Drop blanks, then the final line (the --alias terminator, which
            # legitimately has no continuation backslash).
            _bad_cont: "{{ (_exec_lines | reject('equalto', '') | list)[:-1] | reject('search', _bs_rx) | list }}"
          loop: "{{ _rendered.results }}"
          loop_control:
            label: "{{ item.item.key }}"

        - name: "Remove render scratch dir"
          ansible.builtin.file:
            path: "{{ _render_dir.path }}"
            state: absent
          changed_when: false

    - name: "Validate openwebui_ui mode-aware URL resolution"
      block:
        # Mirrors the expression in roles/openwebui_ui/tasks/main.yml. Checks
        # every mode, and that an explicit override always wins.
        - name: "Resolve backend URL per mode"
          ansible.builtin.set_fact:
            _resolved: >-
              {{ _resolved | default({}) | combine({item.mode ~ '/' ~ (item.override | length | string): (
                   item.override
                   if (item.override | length > 0)
                   else ('http://127.0.0.1:' ~ (llamacpp_port | default(8080) | string) ~ '/v1')
                   if (item.mode == 'llamacpp')
                   else ('http://127.0.0.1:' ~ (vllm_port | default(8000) | string) ~ '/v1')
                 )}) }}
          loop:
            - {mode: "llamacpp", override: ""}
            - {mode: "service", override: ""}
            - {mode: "both", override: ""}
            - {mode: "llamacpp", override: "http://example.invalid/v1"}
          loop_control:
            label: "{{ item.mode }}{{ ' (override)' if item.override else '' }}"

        - name: "Assert each mode maps to the correct backend port"
          ansible.builtin.assert:
            that:
              - "_resolved['llamacpp/0'] == 'http://127.0.0.1:8080/v1'"
              - "_resolved['service/0'] == 'http://127.0.0.1:8000/v1'"
              - "_resolved['both/0'] == 'http://127.0.0.1:8000/v1'"
              # An explicit base URL must win over mode-based resolution.
              - "_resolved['llamacpp/25'] == 'http://example.invalid/v1'"
            fail_msg: "openwebui_ui URL resolution is wrong: {{ _resolved }}"

    - name: "Test lemonade_service defaults"
      vars:
        lemonade_enabled: false
      block:
        - name: "Load lemonade_service defaults"
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../../roles/lemonade_service/defaults/main.yml"

        # --- Lemonade regression guards ---------------------------------
        # Every assertion below encodes something that was measured or
        # debugged on hardware and that fails SILENTLY: the server starts,
        # answers requests, and the only symptom is a missing model or a
        # third of the expected throughput.

        # The single most surprising finding of this deployment. Lemonade
        # sizes a device's memory pool from the JSON key it enumerated the
        # GPU under, and only `amd_igpu` gets the max(vram, GTT) behaviour.
        # Strix Halo enumerates as `amd_gpu`, so the pool is read as
        # vram_gb alone = 0.5 GB (the BIOS carveout), and every streaming
        # model is hidden as "too large for this device" with no error
        # anywhere. Turning this off makes DeepSeek-V4-Flash vanish from
        # `lemonade list` and the failure looks like a bad model name.
        - name: "Assert GTT-aware model filtering is enabled"
          ansible.builtin.assert:
            that:
              - lemonade_config['enable_dgpu_gtt'] | bool
            fail_msg: >-
              enable_dgpu_gtt is off. On gfx1151 Lemonade then sizes the GPU
              pool from vram_gb (0.5 GB) and silently hides every ds4 model
              from the catalog. See roles/lemonade_service/defaults/main.yml.

        # Same finding as the llamacpp ROCm profiles: measured necessary AND
        # sufficient, and seccomp=unconfined does not substitute. Without it
        # the HSA runtime cannot map its shared-memory segments and model
        # load dies with a misleading "Memory in use".
        - name: "Assert the ROCm container declares KFD and --ipc=host"
          ansible.builtin.assert:
            that:
              - "'/dev/kfd' in lemonade_devices"
              - "'/dev/dri' in lemonade_devices"
              - "'--ipc=host' in lemonade_podman_args"
            fail_msg: >-
              Lemonade drives ROCm and needs the KFD compute device plus
              --ipc=host, not just the render node.

        # The ds4 recipe is what makes this deployment different from
        # llamacpp_service; losing it silently downgrades DeepSeek-V4 to
        # "model not found" because no other engine reads its quant.
        - name: "Assert llamacpp:rocm is the serving backend"
          ansible.builtin.assert:
            that:
              - "'llamacpp:rocm' in lemonade_backends"
            fail_msg: >-
              llamacpp:rocm serves every model in this deployment. Its build
              carries the deepseek4 arch, which is why DeepSeek-V4-Flash does
              not need a second engine.

        # ds4 was deployed, measured head-to-head, and removed. Re-adding it
        # is a real decision with a measured cost, not a default to drift
        # back into: 12.8 tok/s against llamacpp:rocm's 17.08 on the same
        # model, a coarser quant, forced SSD streaming that cannot be
        # disabled, and telemetry that reports ttft=0/tps=0.
        - name: "Assert the ds4 backend has not been reintroduced silently"
          ansible.builtin.assert:
            that:
              - "'ds4:rocm' not in lemonade_backends"
              - "lemonade_models | select('search', 'DS4') | list | length == 0"
            fail_msg: >-
              ds4 is back in the defaults. It was removed on measurement, not
              on taste — see docs/PERFORMANCE.md. If upstream has gated
              --ssd-streaming on available GTT, re-measure before restoring
              it, and update this assertion with the new numbers.

        # Downloading a model that extra_models_dir already exposes wastes
        # tens of GB. The one deliberate exception is Qwen3.8-27B, whose
        # catalog entry adds the mmproj sidecar and the mtp label that a bare
        # auto-discovered GGUF does not carry.
        - name: "Assert only the catalog-enriched model is downloaded"
          ansible.builtin.assert:
            that:
              - lemonade_models == ['Qwen3.8-27B-GGUF']
            fail_msg: >-
              lemonade_models should hold only models whose catalog entry adds
              something the raw GGUF lacks (vision projector, mtp label).
              Anything already under llamacpp_model_dir belongs in
              lemonade_required_models, which costs no disk.

        - name: "Assert DeepSeek is served from disk, not re-downloaded"
          ansible.builtin.assert:
            that:
              - lemonade_required_models | select('search', 'DeepSeek-V4-Flash')
                | list | length > 0
              - lemonade_extra_models_host_dir | length > 0
              - lemonade_config['extra_models_dir'] | length > 0
            fail_msg: >-
              DeepSeek-V4-Flash must come from the mounted GGUF tree. Without
              extra_models_dir the same 97 GB quant would be downloaded a
              second time into the Podman volume.

        - name: "Assert every alias points at a required model"
          ansible.builtin.assert:
            that:
              - item.value in lemonade_required_models
            fail_msg: >-
              Alias '{{ item.key }}' targets '{{ item.value }}', which is not
              in lemonade_required_models — `lemonade alias add` would bind it
              to a name the catalog cannot resolve.
          loop: "{{ lemonade_aliases | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        # A silent image move already cost this fleet 33% of a profile's
        # decode once; both the `latest` and `vX.Y.Z` tags move.
        - name: "Assert the Lemonade image is pinned by digest"
          ansible.builtin.assert:
            that:
              - "'@sha256:' in lemonade_image"
            fail_msg: "lemonade_image must be pinned by digest, not by tag."

        # systemd cannot express Conflicts= between these units, so the
        # guard has to live in the play. Without it both stacks claim the
        # iGPU and the second one runs from host memory at a third speed.
        # vllm-server counts: it owns /dev/dri and /dev/kfd too, and its GTT
        # is still held during the drain check.
        - name: "Assert every GPU-owning unit is in the conflict list"
          ansible.builtin.assert:
            that:
              - "'llamacpp-server' in lemonade_stop_conflicting_services"
              - "'vllm-server' in lemonade_stop_conflicting_services"
            fail_msg: >-
              Every unit that can claim /dev/kfd must be stopped before
              Lemonade takes the GPU — nothing in systemd does it for us.

        # Stopping is not enough on its own: a Quadlet unit deployed normally
        # stays WantedBy=default.target, so the next login or reboot starts
        # it alongside Lemonade and recreates the contention.
        - name: "Read the lemonade_service conflict-handling task"
          ansible.builtin.slurp:
            src: "{{ playbook_dir }}/../../roles/lemonade_service/tasks/main.yml"
          register: _lemon_tasks

        - name: "Read the lemonade_service Quadlet template"
          ansible.builtin.slurp:
            src: >-
              {{ playbook_dir }}/../../roles/lemonade_service/templates/lemonade-server.container.j2
          register: _lemon_quadlet

        # `systemctl disable` is NOT the mechanism: Quadlet regenerates its
        # units from [Install] on every daemon-reload and `is-enabled` reports
        # `generated`, so a disable call is a silent no-op. Conflicts= in the
        # unit is what actually survives a reboot — and it is expressible
        # because both stacks are user-scoped.
        - name: "Assert the conflict guard survives a reboot"
          ansible.builtin.assert:
            that:
              - "'Conflicts=' in (_lemon_quadlet.content | b64decode)"
              # Match a real YAML directive, not the phrase inside a comment.
              - >-
                (_lemon_tasks.content | b64decode)
                | regex_search('(?m)^\\s+enabled: false\\s*$') is none
            fail_msg: >-
              The Quadlet must carry Conflicts= for every unit in
              lemonade_stop_conflicting_services, and must NOT rely on
              `enabled: false`, which is a no-op against a generated unit and
              reads like a fix while changing nothing.

        # `lemonade_enabled: false` must not deploy anything. The template
        # task notifies the restart handler, and the handler flush that
        # follows would start the server the switch was meant to keep down.
        - name: "Assert the Quadlet template honours lemonade_enabled"
          ansible.builtin.assert:
            that:
              - >-
                (_lemon_tasks.content | b64decode)
                | regex_search('Deploy Lemonade Quadlet container unit file(.|\n)*?when: lemonade_enabled')
                is not none
            fail_msg: >-
              The Quadlet template task must be guarded by lemonade_enabled.
              Unguarded, it writes the unit and notifies the restart handler,
              and the flush starts the service despite the start task being
              skipped.

        # Two containers read this tree. `Z` is a PRIVATE relabel and would
        # hand the MCS categories to whichever mounted last, locking the
        # other out; no relabel at all fails on a host that has only ever run
        # lemonade.yml, where ~/models is still user_home_t.
        - name: "Read both Quadlet templates"
          ansible.builtin.slurp:
            src: "{{ item }}"
          register: _quadlets
          loop:
            - "{{ playbook_dir }}/../../roles/lemonade_service/templates/lemonade-server.container.j2"
            - "{{ playbook_dir }}/../../roles/llamacpp_service/templates/llamacpp-server.container.j2"
          loop_control:
            label: "{{ item | basename }}"

        - name: "Assert the shared model mount uses a shared SELinux relabel"
          ansible.builtin.assert:
            that:
              # No uppercase (private) relabel anywhere in the volume lines...
              - >-
                (item.content | b64decode)
                | regex_search('(?m)^Volume=.*[:,]Z$') is none
              # ...and the model mount carries a lowercase (shared) one.
              # Rendered forms differ: `/models:z` here, `/models:ro,z` there.
              - >-
                (item.content | b64decode)
                | regex_search('(?m)^Volume=.*models.*[:,]z$') is not none
            fail_msg: >-
              {{ item.item | basename }} must relabel the shared model tree
              with lowercase `z`. `Z` is private and locks the other stack
              out; omitting it entirely is denied under SELinux on a host
              where llamacpp_service has never run.
          loop: "{{ _quadlets.results }}"
          loop_control:
            label: "{{ item.item | basename }}"

        # Leaving Lemonade up after `mise run uninstall` is worse than
        # leaving a llama.cpp profile up: its API is unauthenticated by
        # default and binds 0.0.0.0.
        - name: "Read the uninstall playbook"
          ansible.builtin.slurp:
            src: "{{ playbook_dir }}/../../playbooks/uninstall.yml"
          register: _uninstall

        - name: "Assert uninstall removes the Lemonade unit, container and volumes"
          ansible.builtin.assert:
            that:
              - "'lemonade-server.container' in (_uninstall.content | b64decode)"
              - "'lemonade-cache' in (_uninstall.content | b64decode)"
            fail_msg: >-
              playbooks/uninstall.yml must tear Lemonade down. Otherwise
              `mise run uninstall` leaves an unauthenticated API bound to
              0.0.0.0 and a GPU workload running.

    - name: "Test Lemonade is documented everywhere it must be"
      block:
        - name: "Read the docs that must mention Lemonade"
          ansible.builtin.slurp:
            src: "{{ item }}"
          register: _lemon_docs
          loop:
            - "{{ playbook_dir }}/../../../../../README.md"
            - "{{ playbook_dir }}/../../../../../mise.toml"
            - "{{ playbook_dir }}/../../docs/GETTING_STARTED.md"
            - "{{ playbook_dir }}/../../docs/VARIABLES.md"
          loop_control:
            label: "{{ item | basename }}"

        - name: "Assert Lemonade appears in README, mise.toml, GETTING_STARTED and VARIABLES"
          ansible.builtin.assert:
            that:
              - "'lemonade' in (item.content | b64decode | lower)"
            fail_msg: >-
              Lemonade is missing from {{ item.item | basename }}. A second
              inference stack that is not documented is how operators end up
              running two engines against one GPU.
          loop: "{{ _lemon_docs.results }}"
          loop_control:
            label: "{{ item.item | basename }}"
