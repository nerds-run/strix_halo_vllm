---
- name: Deploy Lemonade Server on AMD Strix Halo
  hosts: all
  gather_facts: true

  roles:
    # Lemonade drives the iGPU through ROCm, so the same hardware gates and
    # the same amdgpu perf-level pinning that llamacpp.yml applies are needed
    # here — DVFS throttling under compute is backend-agnostic.
    - role: nerdsrun.strix_halo_vllm.host_prereqs
      tags:
        - prereqs
    - role: nerdsrun.strix_halo_vllm.gpu_tuning
      tags:
        - gpu
    - role: nerdsrun.strix_halo_vllm.lemonade_service
      tags:
        - lemonade
    # Open WebUI bakes its backend URL in at container creation, so it has to
    # be told when the active stack changes — otherwise it keeps pointing at
    # the llama.cpp port that Conflicts= now guarantees is dead. Runs only
    # when ui_enabled; the role recreates the container if the URL drifted.
    - role: nerdsrun.strix_halo_vllm.openwebui_ui
      vars:
        strix_halo_mode: lemonade
      tags:
        - ui
