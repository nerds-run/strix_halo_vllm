---
# ==========================================================================
# lemonade_service - Lemonade Server (AMD) as a rootless Podman Quadlet
# ==========================================================================
# Lemonade is a model *router*, not a single-model server: one service loads
# and evicts models on demand across several inference engines. That is the
# opposite of llamacpp_service, where one systemd unit serves exactly one
# GGUF. Both can be installed; only one can hold the GPU at a time, which is
# why this role stops the conflicting unit rather than assuming it is down.

lemonade_enabled: true
lemonade_container_name: lemonade-server

# Pinned by digest, same discipline as llamacpp_image. The `latest` and
# `vX.Y.Z` tags both move; a silent image move already cost this fleet 33% of
# a profile's decode once. This digest is the linux/amd64 manifest of v11.9.0.
#
# 11.9.0 brings three things that matter here: llama.cpp b10723 (adds Qwen3-Next
# support, and our Qwen3.8-27B is arch `qwen35` — the Qwen3-Next family), the
# fixed 120s prefill timeout becoming a 600s configurable `global_timeout`
# (26K-token prompts already take ~86s before any slot contention), and the
# `llamacpp-hrx` backend.
#
# HRX is NOT enabled here. It is AMD's HRX runtime in early access, Linux and
# gfx1100/gfx1151 only — which is exactly this hardware — claiming 30-50%
# prefill uplift over Vulkan/HIP. It was tuned on Qwen3-30B-A3B, not on our
# weights, so it is a benchmark hypothesis rather than a default. Switch with
# `llamacpp.backend: hrx` and measure it as its own variable; do not combine it
# with a slot change.
lemonade_version: "11.9.0"
lemonade_image: >-
  ghcr.io/lemonade-sdk/lemonade-server@sha256:7c780707cd695392a8680f557c7c1d55521383a71b1c4c5a9d9e6a226a1bee91

lemonade_host: "0.0.0.0"
lemonade_port: 13305

# Optional bearer token for the OpenAI-compatible API. Empty disables auth.
#
# SECURITY: with lemonade_host 0.0.0.0 and no key, everything on the LAN can
# reach the *control* endpoints (/internal/shutdown, /internal/config), not
# just inference. Lemonade logs a warning at startup when bound to a
# non-loopback host without this set. Set it on any network you do not fully
# trust; LEMONADE_ADMIN_API_KEY alone protects /internal/* but leaves /api,
# /v0 and /v1 open.
lemonade_api_key: ""

# Browser origins allowed to call the API. Loopback (localhost, 127.0.0.1,
# [::1]) and desktop schemes (file://, vscode-webview:// ...) are always
# permitted; every other origin is rejected with a 403.
#
# This bites the moment anyone opens the bundled web UI over the LAN rather
# than on the box itself: the page loads (GET / is 200) but every
# POST /api/v1/chat/completions returns 403, because the browser sends
# `Origin: http://<host>:13305` and that is not loopback. curl is unaffected —
# non-browser clients send no Origin header at all — so the endpoint looks
# healthy from the command line while the UI is dead. The default below
# derives the box's own LAN origin so the shipped UI works as served.
#
# `*` allows any origin and is a genuinely bad idea without lemonade_api_key:
# it lets any website a user visits drive this server from their browser.
lemonade_allowed_origins:
  - "http://{{ ansible_host | default(ansible_default_ipv4.address | default('127.0.0.1')) }}:{{ lemonade_port }}"

# ROCm needs the KFD compute device, not just the render node — and the
# container process must be in the host's render/video groups to open them.
# The GIDs are resolved at run time (getent); Fedora's are 105/39 but that is
# not guaranteed across hosts.
lemonade_devices:
  - /dev/kfd
  - /dev/dri
lemonade_supplementary_groups:
  - render
  - video

# --ipc=host is REQUIRED for ROCm under rootless Podman and the failure
# without it is deeply misleading: the HSA runtime cannot map its
# shared-memory segments and model load dies with "Memory in use". Measured
# necessary AND sufficient here; seccomp=unconfined does not substitute.
# See docs/TROUBLESHOOTING.md.
lemonade_podman_args:
  - --ipc=host

# Named volumes, matching the layout upstream documents. Models land in the
# Podman volume store, NOT in llamacpp_model_dir — Lemonade uses the HF cache
# layout and cannot share the flat --local-dir tree llamacpp_service builds,
# so a model used by both stacks is stored twice.
lemonade_volumes:
  lemonade-cache: /opt/lemonade/.cache/huggingface
  lemonade-llama: /opt/lemonade/llama
  lemonade-data: /opt/lemonade/.cache/lemonade
  lemonade-config: /opt/lemonade/.config/lemonade

# Expose the llamacpp_service GGUF tree to Lemonade, read-only. Lemonade
# stores its own downloads in HF cache layout and cannot read the flat
# --local-dir tree llamacpp_service builds, so without this a model served by
# both stacks is on disk twice. Mounted models appear as `extra.NAME` and cost
# nothing to add. Empty string disables the mount.
# A leading ~ is resolved against the MANAGED host's home in tasks/main.yml,
# not with expanduser — that runs on the controller and would bake the
# controller's home into the remote unit whenever the two users differ.
lemonade_extra_models_host_dir: "{{ llamacpp_model_dir | default('~/models') }}"
lemonade_extra_models_mount: "/models"

# Backend binaries are fetched at run time, so the image itself is
# GPU-agnostic and there is no rocm/vulkan image variant to choose. Installing
# a backend downloads it plus its runtime: llamacpp:rocm pulls llama.cpp
# b10470 and the TheRock ROCm 7.14.0 gfx1151 runtime (~1.8 GB).
# ds4 (DwarfStar) is deliberately NOT installed. It is the only engine that
# reads antirez's asymmetric IQ2XXS quant, but measured head-to-head on this
# box it loses to llama.cpp/ROCm on every axis: 12.8 tok/s against 17.08, a
# coarser quant (~2.3 bpw vs 2.90 bpw verified 90.8% token-identical against
# the full-precision API), forced SSD streaming that cannot be turned off, and
# broken telemetry (ttft=0, tps=0). See docs/PERFORMANCE.md for the numbers.
# Re-add 'ds4:rocm' here and the IQ2XXS model below if upstream gates
# --ssd-streaming on available GTT.
lemonade_backends:
  - llamacpp:rocm

# Applied with `lemonade config set k=v`, then the service is restarted —
# model filtering is evaluated at startup, so a config change is invisible
# until it is.
#
# enable_dgpu_gtt is MANDATORY on Strix Halo and the reason is non-obvious.
# Lemonade sizes a device's memory pool from the JSON key it enumerated the
# GPU under: only `amd_igpu` gets MemoryAllocBehavior::Largest (max of vram
# and GTT). This APU enumerates as `amd_gpu`, so it falls to ::Hardware,
# which returns vram_gb alone — 0.5 GB, the BIOS carveout, ignoring the
# 124 GB GTT the whole fleet actually runs on. Any model with a resident
# working set above 0.5 GB is then hidden as "too large for this device".
# The visible symptom is a model silently absent from `lemonade list` with no
# error anywhere; enable_dgpu_gtt switches the calculation to ::Unified
# (vram + GTT) and it appears. Only streaming backends (ds4) are affected —
# llamacpp models stay visible either way, which makes this look like a ds4
# bug rather than a device-detection one.
lemonade_config:
  enable_dgpu_gtt: true
  llamacpp.backend: rocm
  extra_models_dir: "{{ lemonade_extra_models_mount if lemonade_extra_models_host_dir | length > 0 else '' }}"

# Models Lemonade downloads itself. Names must match `lemonade list` exactly.
#
# Qwen3.8-27B is deliberately downloaded even though ~/models already holds
# the same GGUF and it is visible via extra_models_dir. The catalog entry is
# not equivalent to the bare file: it declares the `mmproj` sidecar (vision)
# and carries the `mtp` label that switches on speculative decoding. That is
# where 26.95 tok/s at a 7.7K prompt comes from, against 12.3 for the same
# weights on the Vulkan `qwen38` profile. An auto-discovered extra.* entry is
# a bare GGUF with neither. ~17 GB is the price of vision plus ~2x decode.
lemonade_models:
  - Qwen3.8-27B-GGUF

# Models that must resolve in the catalog but are NOT downloaded here —
# they come from extra_models_dir, already on disk for llamacpp_service.
# Deploy fails if one is missing, which is the signal that the mount or the
# memory-pool filter is wrong rather than the name.
lemonade_required_models:
  - Kevletesteur_DeepSeek-V4-Flash-0731-StrixHalo-Verified-GGUF

# Friendly aliases for the auto-generated extra.* names, which are derived
# from the directory and are unusable in a chat UI.
lemonade_aliases:
  deepseek-v4: Kevletesteur_DeepSeek-V4-Flash-0731-StrixHalo-Verified-GGUF

# Every other GPU consumer in this collection. All are user-scoped Quadlet
# units with no Conflicts= between them, so nothing stops two from claiming
# the iGPU at once — the guard has to live in the play. vllm-server belongs
# here as much as llamacpp-server: it owns /dev/dri and /dev/kfd too, and its
# GTT would still be held during the drain check below.
#
# Each name here becomes a `Conflicts=<name>.service` line in the Lemonade
# Quadlet AND is stopped at deploy time. Both are needed: stopping releases
# GTT now, Conflicts= is what survives a reboot. Note that `systemctl disable`
# is NOT the answer for these — Quadlet regenerates its units from [Install]
# on every daemon-reload, `is-enabled` reports `generated`, and a disable call
# is a silent no-op.
lemonade_stop_conflicting_services:
  - llamacpp-server
  - vllm-server

# Seconds to wait for the driver to release GTT after stopping a conflicting
# unit. Starting a large load against stale GTT is what triggers the autofit
# failure documented in docs/TROUBLESHOOTING.md.
lemonade_gtt_drain_timeout: 120

firewall_open_lemonade_port: false

# ---------------------------------------------------------------------------
# Slot / context profiles
# ---------------------------------------------------------------------------
# Slots SUBDIVIDE llama-server's context rather than each getting their own, so
# holding a full 262144-token window per request means asking for
# parallel x 262144 in TOTAL. Verified live via /props total_slots and
# /slots[0].n_ctx — never from the rendered flag.
#
# `--parallel 1` is Lemonade's own catalog default for Qwen3.8-27B (it became
# the llamacpp backend default in 11.8.0), NOT something this repo sets. We
# override it per-model through POST /api/v1/models/{id}/options, which needs
# no re-pull of the 17 GB weights.
lemonade_slot_profile: "single"

lemonade_slot_profiles:
  single:
    parallel: 1
    ctx_per_slot: 262144
  dual:
    parallel: 2
    ctx_per_slot: 262144
  triple:
    parallel: 3
    ctx_per_slot: 262144
    # Bought by giving the cache back. Three slots need 68.7 GiB of GTT, and
    # the measured 24576 MiB pool would put the total at 92.7 GiB — past the
    # budget. A hit is worth 11.7x on TTFT (24.8s -> 2.12s) while a slot only
    # removes queueing, so this is very likely the wrong trade for interactive
    # or agentic work. It exists for genuinely concurrency-bound workloads.
    cache_ram_mib: 8192

# Recurrent-state checkpoints are kept PER SLOT and serialized fp32 into host
# RAM, so this term scales with slot count, not with context. At the llama.cpp
# default of 32 that is ~4.7 GiB per slot on this geometry
# (ggml-org/llama.cpp#27211); the Vulkan `qwen38` profile already pins 8 for
# the same reason. Fewer checkpoints means more recompute on slot rollback.
lemonade_ctx_checkpoints: 8

# In-memory prompt-cache pool. The llama.cpp default is 8192 MiB, and on this
# workload that is far too small: cache entries measure 1.3-2.6 GiB each, so
# the pool holds three to five of them and logs
#   "srv alloc: - making room for prompt cache entry, removing oldest entry"
# on essentially every request. 76 of 83 requests in a 48h sample paid a full
# prefill as a result. This is a benchmark axis, not a settled value.
# MEASURED 2026-09-09 on 11.9.0/b10707, 1 slot, 8 distinct ~9.5K-token prefixes:
#     8192 MiB -> 0 of 4 possible prefix hits, every request 24.8s
#    24576 MiB -> 4 of 4 hits, 2.12s on a hit  (11.7x)
#    49152 MiB -> 4 of 4 hits, 2.17s           (no gain, 24 GiB wasted)
# The failure is a cliff, not a slope: below the working set nothing is
# retained at all. Sized here to the winner.
lemonade_cache_ram_mib: 24576

# Ceiling for the memory guard, in GiB. NOT the 124 GiB GTT maximum: buff/cache
# holds the 16.7 GB GGUF, and pinning GTT past roughly this point evicts it and
# triggers the documented throughput cliff (deepseek-v4 measured 120 of 125 GB
# resident, buff/cache collapsed to ~1 GB, decode 3.88 tok/s against ~20-27).
lemonade_gtt_budget_gib: 85

# Memory geometry of the model the slot profile applies to. Parsed from the
# GGUF header on hardware (arch qwen35, block_count 65, head_count_kv 4,
# key_length = value_length = 256, ssm.inner_size 6144):
#   16 attention layers x 4 kv_heads x (256 + 256) x 2 B = 64 KiB per token
#   weights 16746 MiB + mmproj-F16 885 MiB = 17.22 GiB
# These are per-model facts — re-derive them before pointing this at other
# weights. `lemonade bench` is the way to confirm.
lemonade_slot_model_gib: 17.22
lemonade_slot_kv_kib_per_token: 64
lemonade_slot_ckpt_mib: 149.6
lemonade_slot_target_model: "Qwen3.8-27B-GGUF"

# Seconds to allow for a model reload when applying a slot profile. Loading
# ~17 GB of weights plus allocating KV for the full context takes tens of
# seconds; Lemonade's own prefill timeout became 600s in 11.9.0 for the same
# reason.
lemonade_slot_load_timeout: 600
