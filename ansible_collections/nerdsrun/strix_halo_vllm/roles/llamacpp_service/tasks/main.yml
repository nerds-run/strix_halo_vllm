---
# ==========================================================================
# llamacpp_service - Run llama.cpp (Vulkan) as a systemd-managed Podman
#                    Quadlet service for GGUF model inference
# ==========================================================================

# ------------------------------------------------------------------
# 1. Resolve active model profile
# ------------------------------------------------------------------
- name: Validate model profile exists
  ansible.builtin.assert:
    that:
      - llamacpp_model_profile in llamacpp_model_profiles
    fail_msg: >-
      Unknown profile '{{ llamacpp_model_profile }}'.
      Valid profiles: {{ llamacpp_model_profiles.keys() | list | join(', ') }}
  tags:
    - llamacpp

- name: Resolve active model profile
  ansible.builtin.set_fact:
    llamacpp_active: "{{ llamacpp_model_profiles[llamacpp_model_profile] }}"
  tags:
    - llamacpp

- name: Display active model profile
  ansible.builtin.debug:
    msg: "Profile: {{ llamacpp_model_profile }} — {{ llamacpp_active.repo }} (ctx={{ llamacpp_active.ctx_size }})"
  tags:
    - llamacpp

# Stops before a ~104GB download and a guaranteed-to-crash server start.
# A profile opts in by setting `unsupported_reason`; clearing the gate is an
# explicit, per-run choice so the block can't rot into a silent no-op once
# upstream support lands.
- name: Refuse to deploy a profile whose architecture is unsupported
  ansible.builtin.fail:
    msg: |
      Profile '{{ llamacpp_model_profile }}' is gated and will not deploy.

      Reason: {{ llamacpp_active.unsupported_reason }}

      This is a known limitation, not a misconfiguration. The profile is
      defined in full so it is ready the moment upstream support lands.

      To attempt it anyway (expect llama-server to fail at model load):
        -e llamacpp_allow_unsupported=true
  when:
    - llamacpp_active.unsupported_reason is defined
    - not (llamacpp_allow_unsupported | default(false) | bool)
  tags:
    - llamacpp

# ------------------------------------------------------------------
# 2. Expand paths
# ------------------------------------------------------------------
- name: Expand model directory path
  ansible.builtin.set_fact:
    llamacpp_service_model_dir_expanded: "{{ llamacpp_model_dir | expanduser }}"
  tags:
    - llamacpp

# ------------------------------------------------------------------
# 3. Ensure directories exist
# ------------------------------------------------------------------
- name: Ensure model directory exists
  ansible.builtin.file:
    path: "{{ llamacpp_service_model_dir_expanded }}"
    state: directory
    mode: "0755"
  become: false
  tags:
    - llamacpp

# ------------------------------------------------------------------
# 4. Pull container image
# ------------------------------------------------------------------
- name: Pull llama.cpp Vulkan container image
  ansible.builtin.command:
    cmd: "podman pull {{ llamacpp_image }}"
  become: false
  register: llamacpp_service_image_pull
  changed_when: "'Writing' in llamacpp_service_image_pull.stdout or 'Storing' in llamacpp_service_image_pull.stdout"
  tags:
    - llamacpp

# ------------------------------------------------------------------
# 5. Download GGUF model files
# ------------------------------------------------------------------
- name: Ensure pip is installed
  ansible.builtin.package:
    name: python3-pip
    state: present
  become: true
  tags:
    - llamacpp

- name: Ensure huggingface-hub is available
  ansible.builtin.pip:
    name: "huggingface-hub"
    state: present
    extra_args: "--user"
  become: false
  tags:
    - llamacpp

- name: Resolve hf CLI path
  ansible.builtin.set_fact:
    llamacpp_service_hf_cli: "{{ ansible_facts['env']['HOME'] }}/.local/bin/hf"
  tags:
    - llamacpp

- name: Resolve model base directory
  ansible.builtin.set_fact:
    llamacpp_service_repo_dir: "{{ llamacpp_active.repo | regex_replace('/', '_') }}"
    llamacpp_service_model_base: "{{ llamacpp_service_model_dir_expanded }}/{{ llamacpp_active.repo | regex_replace('/', '_') }}"
  tags:
    - llamacpp

# A profile's `include` is normally one glob for the chosen quant. Profiles that
# also need sidecar files from the same repo — a vision projector, an MTP draft
# model — set a list instead, and each pattern gets its own --include flag.
#
# The flag MUST be repeated. `--include "a" "b" "c"` looks like it works and
# does not: hf's --include takes exactly one TEXT, so the trailing patterns are
# reparsed as positional FILENAMES, which in turn makes hf discard --include
# entirely ("Ignoring `--include` since filenames have being explicitly set").
# The result is a silent partial download — the quant you actually wanted is
# the one that goes missing, and the exit code is 0.
- name: Normalise model include patterns to a list
  ansible.builtin.set_fact:
    llamacpp_service_includes: >-
      {{ [llamacpp_active.include] if llamacpp_active.include is string
         else llamacpp_active.include }}
  tags:
    - llamacpp

- name: Download GGUF model from Hugging Face
  ansible.builtin.command:
    cmd: >-
      {{ llamacpp_service_hf_cli }} download {{ llamacpp_active.repo }}
      --local-dir {{ llamacpp_service_model_base }}
      {% for pat in llamacpp_service_includes %}--include "{{ pat }}" {% endfor %}
      {% if hf_token %}--token {{ hf_token }}{% endif %}
  become: false
  register: llamacpp_service_download
  changed_when: "'Fetching' in (llamacpp_service_download.stderr | default(''))"
  no_log: "{{ hf_token | default('') | length > 0 }}"
  tags:
    - llamacpp

# ------------------------------------------------------------------
# 6. Deploy Quadlet unit
# ------------------------------------------------------------------
# Some profiles pair a target model from one repo with a speculative drafter
# published in another (deepseek-v4 pairs Kevletesteur's requantized target
# with unsloth's DSpark drafter). Fetch that separately when draft_repo is set.
- name: Download speculative drafter from a separate Hugging Face repo
  ansible.builtin.command:
    cmd: >-
      {{ llamacpp_service_hf_cli }} download {{ llamacpp_active.draft_repo }}
      --local-dir {{ llamacpp_service_model_dir_expanded }}/{{ llamacpp_active.draft_repo | regex_replace('/', '_') }}
      --include "{{ llamacpp_active.draft_file }}"
      {% if hf_token %}--token {{ hf_token }}{% endif %}
  become: false
  register: llamacpp_service_draft_download
  changed_when: "'Fetching' in (llamacpp_service_draft_download.stderr | default(''))"
  no_log: "{{ hf_token | default('') | length > 0 }}"
  when:
    - llamacpp_active.draft_repo is defined
    - llamacpp_active.draft_repo != llamacpp_active.repo
  tags:
    - llamacpp

- name: Ensure systemd user Quadlet directory exists
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/containers/systemd"
    state: directory
    mode: "0755"
  become: false
  tags:
    - llamacpp

- name: Deploy llama.cpp Quadlet container unit file
  ansible.builtin.template:
    src: llamacpp-server.container.j2
    dest: "{{ ansible_user_dir }}/.config/containers/systemd/{{ llamacpp_container_name }}.container"
    mode: "0600"
  become: false
  no_log: "{{ (hf_token | default('') | length > 0) or (llamacpp_api_key_enabled | bool) }}"
  notify:
    - Reload systemd user daemon
    - Restart llamacpp service
  tags:
    - llamacpp

- name: Flush handlers to apply Quadlet changes
  ansible.builtin.meta: flush_handlers
  tags:
    - llamacpp

# ------------------------------------------------------------------
# 7. Enable and start service
# ------------------------------------------------------------------
- name: Enable and start llama.cpp service
  ansible.builtin.systemd:
    name: "{{ llamacpp_container_name }}"
    state: started
    enabled: true
    scope: user
  become: false
  when: llamacpp_enabled | bool
  tags:
    - llamacpp

# ------------------------------------------------------------------
# 8. Firewall
# ------------------------------------------------------------------
- name: Open llama.cpp port in firewall
  ansible.posix.firewalld:
    port: "{{ llamacpp_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  become: true
  when:
    - firewall_open_llamacpp_port | bool
    - llamacpp_enabled | bool
  tags:
    - llamacpp

# ------------------------------------------------------------------
# 9. Health check
# ------------------------------------------------------------------
- name: Wait for llama.cpp API to become available
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llamacpp_port }}/v1/models"
    method: GET
    return_content: false
    status_code: 200
  become: false
  register: llamacpp_service_health
  until: llamacpp_service_health.status == 200
  retries: 60
  delay: 15
  when: llamacpp_enabled | bool
  tags:
    - llamacpp

# ------------------------------------------------------------------
# 10. Display info
# ------------------------------------------------------------------
- name: Display llama.cpp service information
  ansible.builtin.debug:
    msg: |
      llama.cpp server is running as a systemd user service.

      Profile    : {{ llamacpp_model_profile }}
      Service    : {{ llamacpp_container_name }}
      Image      : {{ llamacpp_active.image | default(llamacpp_image) }}
      Model      : {{ llamacpp_active.repo }} ({{ llamacpp_active.file }})
      API        : http://{{ llamacpp_host }}:{{ llamacpp_port }}/v1
      Context    : {{ llamacpp_active.ctx_size }} tokens
      Backend    : {{ llamacpp_active.backend | default('Vulkan (RADV) — bypasses ROCm/HIP hang on gfx1151') }}

      Manage with:
        systemctl --user status {{ llamacpp_container_name }}
        systemctl --user restart {{ llamacpp_container_name }}
        journalctl --user -u {{ llamacpp_container_name }} -f

      Test:
        curl http://localhost:{{ llamacpp_port }}/v1/models
  when: llamacpp_enabled | bool
  tags:
    - llamacpp
